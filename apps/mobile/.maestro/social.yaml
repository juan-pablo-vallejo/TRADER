# Google, and Apple's own button on an iPhone, with the development stand-in, which signs in
# as the account whose email the field holds (src/sign-in-provider.ts): ${EMAIL} lands on
# Today and is offered no key; an empty field is an account no company has added, told to ask the
# office, and on Apple's button told how to undo Hide My Email.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/launch.yaml
- assertVisible:
    id: "sign-in-google"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: "sign-in-apple"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible:
          id: "sign-in-apple"
- takeScreenshot: sign-in-social
- tapOn:
    id: "sign-in-google"
- extendedWaitUntil:
    visible: "No company has added this sign-in. Ask the office."
    timeout: 30000
- tapOn:
    id: "sign-in-address"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-google"
- extendedWaitUntil:
    visible:
      id: "tab-me"
    timeout: 30000
- assertNotVisible:
    id: "biometric-offer"
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: parts/sign-out.yaml
      # Apple's account no login holds: its own sentence, on how Hide My Email is undone.
      - tapOn:
          id: "sign-in-apple"
      - extendedWaitUntil:
          visible: "Apple did not share an email the office has.*"
          timeout: 30000
      - tapOn:
          id: "sign-in-address"
      - inputText: ${EMAIL}
      - tapOn:
          id: "sign-in-apple"
      - extendedWaitUntil:
          visible:
            id: "tab-me"
          timeout: 30000
