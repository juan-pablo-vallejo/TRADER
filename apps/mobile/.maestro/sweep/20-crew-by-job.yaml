# Crew by jobsite: who is on each, and who is expected. From the not-found screen, its way
# back to Today, then Crew.
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "not-found"
    commands:
      - scrollUntilVisible:
          element:
            id: "not-found-action"
          centerElement: true
      - tapOn:
          id: "not-found-action"
- extendedWaitUntil:
    visible:
      id: "tab-crew"
    timeout: 30000
# Tapped until the screen shows: a tap that lands while the app redraws is lost.
- repeat:
    while:
      notVisible:
        id: "crew"
    times: 3
    commands:
      - tapOn:
          id: "tab-crew"
      - extendedWaitUntil:
          visible:
            id: "crew"
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible:
      id: "crew-view-job"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "crew-view-job"
    centerElement: true
- tapOn:
    id: "crew-view-job"
# Partly in view is enough: at the largest text a jobsite's card is taller than the screen.
- scrollUntilVisible:
    element:
      id: "crew-job-0"
    visibilityPercentage: 10
    timeout: 60000
    speed: 70
