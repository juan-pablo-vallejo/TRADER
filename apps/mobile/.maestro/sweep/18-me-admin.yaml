# Me, as an admin: the name editable, with Save.
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- runFlow:
    file: close-sheets.yaml
# A sheet left open closes when the app goes to the background between steps; one still
# showing is closed here.
- runFlow:
    when:
      visible:
        id: "add-sheet"
    commands:
      - scrollUntilVisible:
          element:
            id: "form-cancel"
          centerElement: true
          optional: true
          timeout: 60000
          speed: 70
      - tapOn:
          id: "form-cancel"
          optional: true
# Tapped until the screen shows: a tap that lands while the app redraws is lost.
- repeat:
    while:
      notVisible:
        id: "me"
    times: 3
    commands:
      - tapOn:
          id: "tab-me"
      - extendedWaitUntil:
          visible:
            id: "me"
          timeout: 10000
          optional: true
- assertVisible:
    id: "me"
