# The code given: Face ID or fingerprint is offered once, where the phone has it, in the
# run's language. A development build's stand-in offers it on every simulator and emulator
# (src/biometrics.ts).
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- tapOn:
    id: "sign-in-code"
- inputText: "123456"
- extendedWaitUntil:
    visible:
      id: "biometric-offer"
    timeout: 30000
- runFlow:
    when:
      true: ${LANG == "es"}
    commands:
      - assertVisible: "Inicia sesión más rápido"
- runFlow:
    when:
      true: ${LANG != "es"}
    commands:
      - assertVisible: "Sign in faster"
