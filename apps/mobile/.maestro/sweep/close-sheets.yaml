# Any sheet a step before left open is closed, so each step starts on its screen: a job's,
# the sync chip's, switching job, clocking out, a person's, adding a shift, moving someone,
# a jobsite's on Crew, setting its location. Its close button can be below the screen at
# the largest text.
appId: app.jpteq.trader
---
- runFlow:
    when:
      visible:
        id: "job-sheet"
    commands:
      - scrollUntilVisible:
          element:
            id: "job-close"
          timeout: 60000
          speed: 70
          optional: true
      - tapOn:
          id: "job-close"
          optional: true
