# The sync chip's sheet. Tapped near its start: on Android a development build's own
# button can float over the band's top right (deliver.yaml).
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- tapOn:
    id: "sync-pending|sync-synced|sync-attention"
    point: "15%,50%"
# The chip changes its word as entries go; a tap that lands mid-change opens nothing
# (deliver.yaml): once more.
- extendedWaitUntil:
    visible:
      id: "sync-sheet"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "sync-sheet"
    commands:
      - tapOn:
          id: "sync-pending|sync-synced|sync-attention"
          point: "15%,50%"
- extendedWaitUntil:
    visible:
      id: "sync-sheet"
    timeout: 10000
