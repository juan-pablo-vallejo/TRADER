# On a break.
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
# A sheet left open closes when the app goes to the background between steps; one still
# showing is closed here.
- runFlow:
    when:
      visible:
        id: "sync-sheet"
    commands:
      - scrollUntilVisible:
          element:
            id: "sync-close"
          centerElement: true
          optional: true
          timeout: 60000
          speed: 70
      - tapOn:
          id: "sync-close"
          optional: true
# At the largest text the foot's buttons scroll with the page, and the clock is above.
- scrollUntilVisible:
    element:
      id: "clock-pause"
    centerElement: true
- tapOn:
    id: "clock-pause"
- scrollUntilVisible:
    element:
      id: "clock-paused"
    direction: UP
    centerElement: true
