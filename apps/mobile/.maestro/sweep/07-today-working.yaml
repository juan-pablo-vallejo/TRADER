# On the clock.
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- runFlow:
    file: close-sheets.yaml
# A sheet left open closes when the app goes to the background between steps; one still
# showing is closed here.
- runFlow:
    when:
      visible:
        id: "job-sheet"
    commands:
      - scrollUntilVisible:
          element:
            id: "job-close"
          centerElement: true
          optional: true
          timeout: 60000
          speed: 70
      - tapOn:
          id: "job-close"
          optional: true
# At the largest text the foot's buttons scroll with the page, and the clock is above.
- scrollUntilVisible:
    element:
      id: "clock-in"
    centerElement: true
- tapOn:
    id: "clock-in"
- scrollUntilVisible:
    element:
      id: "clock-working"
    direction: UP
    centerElement: true
