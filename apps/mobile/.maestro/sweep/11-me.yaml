# Me, as a worker: the name and both addresses greyed, the office's.
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- runFlow:
    file: close-sheets.yaml
# Tapped until the screen shows: a tap that lands while the app redraws is lost.
- repeat:
    while:
      notVisible:
        id: "me"
    times: 3
    commands:
      - tapOn:
          id: "tab-me"
      - extendedWaitUntil:
          visible:
            id: "me"
          timeout: 10000
          optional: true
- assertVisible:
    id: "me"
