# Week for someone with no shift in the next two weeks: Sam (matrix.sh).
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- runFlow:
    file: ../parts/sign-out.yaml
- runFlow:
    file: in.yaml
    env:
      ADDRESS: ${SAM}
      LANDS_ON: today
- repeat:
    while:
      notVisible:
        id: "week"
    times: 3
    commands:
      - tapOn:
          id: "tab-week"
      - extendedWaitUntil:
          visible:
            id: "week"
          timeout: 10000
          optional: true
- scrollUntilVisible:
    element:
      id: "week-empty.*"
    centerElement: true
    timeout: 30000
