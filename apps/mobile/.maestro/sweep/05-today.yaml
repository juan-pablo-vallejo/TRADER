# Today, off the clock, with a shift to start (matrix.sh gives the worker one around now).
appId: app.jpteq.trader
---
# Each step is its own Maestro run, whose driver puts the app in the background: back to
# the front, as it was.
- launchApp:
    stopApp: false
- runFlow:
    file: not-now.yaml
    env:
      LANDS_ON: today
- runFlow:
    file: ../parts/landed.yaml
    env:
      LANDS_ON: today
