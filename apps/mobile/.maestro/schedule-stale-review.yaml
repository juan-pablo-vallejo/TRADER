# The connection is back: the server stored the start, flagged as outside the schedule, and
# it counts. The phone says so beside the hours. The person is still on the clock.
appId: app.jpteq.trader
---
- tapOn:
    id: "sync-pending|sync-synced|sync-attention"
# The chip changes its word as entries go; a tap that lands mid-change opens nothing.
- runFlow:
    when:
      notVisible:
        id: "sync-now"
    commands:
      - tapOn:
          id: "sync-pending|sync-synced|sync-attention"
- tapOn:
    id: "sync-now"
- tapOn:
    id: "sync-close"
# The sheet's list shrinks as entries go, and a tap that lands mid-move closes nothing:
# close until it is closed.
- repeat:
    times: 3
    while:
      visible:
        id: "sync-close"
    commands:
      - tapOn:
          id: "sync-close"
          waitToSettleTimeoutMs: 1500
- assertVisible:
    id: "clock-working"
- tapOn:
    id: "tab-week"
- scrollUntilVisible:
    element:
      id: "hours-unscheduled-0"
    direction: DOWN
    timeout: 60000
- takeScreenshot: week-hours-flagged
