# The connection is back: the server stored the start, flagged as outside the schedule, and
# it counts. The phone says so beside the hours. The person is still on the clock.
appId: app.jpteq.trader
---
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "sync-now"
- tapOn:
    id: "tab-today"
# A tap that lands while the tab bar redraws is lost: ask again if Today is not up.
- runFlow:
    when:
      notVisible:
        id: "clock-working|clock-paused|clock-off"
    commands:
      - tapOn:
          id: "tab-today"
- assertVisible:
    id: "clock-working"
- tapOn:
    id: "tab-week"
- scrollUntilVisible:
    element:
      id: "hours-unscheduled-0"
    direction: DOWN
    timeout: 60000
