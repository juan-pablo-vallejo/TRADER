# The Crew tab, signed in as the demo admin, who has no shift today: the app opens on Crew.
# The admin adds a shift today for a worker who had none, and sees them expected, by person
# and by jobsite. People and jobsites are chosen by their names, which are the same in both
# languages; everything else is chosen by id.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/sign-in.yaml
- assertVisible:
    id: "tab-crew"
- extendedWaitUntil:
    visible:
      id: "crew-count-expected"
    timeout: 30000
- takeScreenshot: crew
# Centred: just scrolled into view, the button can sit under the tab bar, which then takes
# the tap once the crew list is long enough to scroll.
- scrollUntilVisible:
    element:
      id: "crew-add"
    centerElement: true
- tapOn:
    id: "crew-add"
- assertVisible:
    id: "add-sheet"
- scrollUntilVisible:
    element: "Sam Carter"
    centerElement: true
- tapOn: "Sam Carter"
- scrollUntilVisible:
    element: "Harbor View unit 4B"
    centerElement: true
- tapOn: "Harbor View unit 4B"
- scrollUntilVisible:
    element:
      id: "form-save"
- takeScreenshot: crew-add
- tapOn:
    id: "form-save"
# The saved note is drawn at the top of the list, which keeps where it was scrolled to:
# the form's Save is far down it once the crew is long.
- scrollUntilVisible:
    element:
      id: "crew-note"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element: "Sam Carter, .*"
    centerElement: true
- tapOn: "Sam Carter, .*"
- assertVisible:
    id: "person-status-expected"
- assertVisible:
    id: "person-shift-0"
- takeScreenshot: crew-person
- scrollUntilVisible:
    element:
      id: "person-close"
    centerElement: true
- tapOn:
    id: "person-close"
- scrollUntilVisible:
    element:
      id: "crew-view-job"
    direction: UP
    centerElement: true
- tapOn:
    id: "crew-view-job"
- assertVisible:
    id: "crew-job-0"
- takeScreenshot: crew-by-job
