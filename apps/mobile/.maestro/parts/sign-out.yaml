# From anywhere in the app: Me, then Sign out, back on the sign-in field. A tab tap made
# while a screen is still settling can land on its neighbour, so Me is asked for until it
# is there.
appId: app.jpteq.trader
---
# Me's page runs under the tab bar, where Maestro counts Sign out as in view though a tap
# there lands on a tab: the page is dragged to its foot first, and the whole asked again
# until the sign-in screen shows.
- repeat:
    while:
      notVisible:
        id: "sign-in"
    times: 3
    commands:
      - repeat:
          while:
            notVisible:
              id: "me"
          times: 3
          commands:
            - tapOn:
                id: "tab-me"
            - extendedWaitUntil:
                visible:
                  id: "me"
                timeout: 5000
                optional: true
      # Not centred: Sign out sits near the page's end, where the page cannot scroll it up
      # to the middle, and the scroll would never stop. At the largest text Me is long:
      # more time, and faster.
      - scrollUntilVisible:
          element:
            id: "sign-out"
          timeout: 60000
          speed: 70
      - scroll
      - scroll
      - tapOn:
          id: "sign-out"
      # The sign-in screen itself: at the largest text its field is below the fold.
      - extendedWaitUntil:
          visible:
            id: "sign-in"
          timeout: 10000
          optional: true
- assertVisible:
    id: "sign-in"
