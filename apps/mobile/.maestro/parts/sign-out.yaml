# From anywhere in the app: Me, then Sign out, back on the sign-in field. A tab tap made
# while a screen is still settling can land on its neighbour, so Me is asked for until it
# is there.
appId: app.jpteq.trader
---
- repeat:
    while:
      notVisible:
        id: "me"
    times: 3
    commands:
      - tapOn:
          id: "tab-me"
      - extendedWaitUntil:
          visible:
            id: "me"
          timeout: 5000
          optional: true
- scrollUntilVisible:
    element:
      id: "sign-out"
    centerElement: true
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "sign-in-address"
    timeout: 30000
