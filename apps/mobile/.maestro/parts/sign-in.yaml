# Launches the development build fresh (launch.yaml) and signs in as ${EMAIL}, an email or a
# mobile number, through the sign-in screen with the development stand-in for Clerk
# (src/sign-in-provider.ts): the address, then the stand-in's code, 123456, whose last digit
# sends it.
appId: app.jpteq.trader
---
- runFlow:
    file: launch.yaml
- runFlow:
    file: code.yaml
    env:
      ADDRESS: ${EMAIL}
      CODE: "123456"
- runFlow:
    file: landed.yaml
