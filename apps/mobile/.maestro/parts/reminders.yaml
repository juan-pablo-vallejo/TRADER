# After a person's first clock-in the app asks once whether to remind them of their shifts
# (reminders.tsx). The flows answer "Not now": what they test is the clock. The question
# comes only once per installed app, so on any later clock-in this does nothing.
appId: app.jpteq.trader
---
- extendedWaitUntil:
    visible:
      id: "reminders-not-now"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: "reminders-not-now"
    commands:
      - tapOn:
          id: "reminders-not-now"
