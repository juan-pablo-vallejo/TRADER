# Launches the development build with nothing kept from a run before, onto sign-in. A
# development build opens on its launcher and must be handed the bundler, as `expo run`
# does; the three switches are the ones it passes itself (no first-launch sheet, no floating
# button, no reopening of the last project). On iOS the flow does it. On Android Maestro's
# openLink cuts the link at its first `&`, so `run.sh` clears the app and opens the link
# through adb, and passes LAUNCH=adb.
appId: app.jpteq.trader
---
- runFlow:
    when:
      true: ${LAUNCH == "maestro"}
    commands:
      # The location is this run's own; notifications are granted, since the app asks for
      # them as it opens (shift reminders are always on) and the question would cover it.
      - launchApp:
          clearState: true
          permissions:
            location: ${IOS_LOCATION}
            notifications: allow
      - openLink: "exp+trader://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- runFlow:
    file: location.yaml
# The sign-in screen or the tabs: the screen itself, since at the largest text its field is
# below the fold until a flow scrolls to it.
- extendedWaitUntil:
    visible:
      id: "sign-in|sign-in-address|tab-me"
    timeout: 120000
# A session that outlived the reset is signed out first: every run starts from sign-in.
- runFlow:
    when:
      visible:
        id: "tab-me"
    commands:
      - runFlow:
          file: location.yaml
      - tapOn:
          id: "tab-me"
      - scrollUntilVisible:
          element:
            id: "sign-out"
          centerElement: true
      - tapOn:
          id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "sign-in|sign-in-address"
    timeout: 30000
