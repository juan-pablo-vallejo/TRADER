# From the sign-in field: ${ADDRESS} typed and sent, then ${CODE} typed into the code step.
appId: app.jpteq.trader
---
- tapOn:
    id: "sign-in-address"
- inputText: ${ADDRESS}
# Go on the keyboard: what a person does with it up, and what Send does.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "sign-in-code"
    timeout: 30000
- tapOn:
    id: "sign-in-code"
- inputText: ${CODE}
