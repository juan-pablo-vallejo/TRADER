# The API is back (suite.sh has started it): Send now, behind the chip, and everything is
# sent.
appId: app.jpteq.trader
---
# Near the chip's start: on Android the relaunch in offline-capture.yaml reaches the
# development build without the link's `__expo_disable_fab=1`, and the build's own button
# then floats over the band's top right, where the chip's end is.
- tapOn:
    id: "sync-pending|sync-synced|sync-attention"
    point: "15%,50%"
# The chip changes its word as entries go; a tap that lands mid-change opens nothing.
- runFlow:
    when:
      notVisible:
        id: "sync-now"
    commands:
      - tapOn:
          id: "sync-pending|sync-synced|sync-attention"
          point: "15%,50%"
- tapOn:
    id: "sync-now"
- tapOn:
    id: "sync-close"
# The sheet's list shrinks as entries go, and a tap that lands mid-move closes nothing:
# close until it is closed.
- repeat:
    times: 3
    while:
      visible:
        id: "sync-close"
    commands:
      - tapOn:
          id: "sync-close"
          waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: "sync-synced"
    timeout: 60000
