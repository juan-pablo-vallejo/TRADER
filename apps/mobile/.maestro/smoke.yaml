# The phone app's smoke flow: the development build launches, a demo worker
# signs in with the development identity, and the jobsites the server answers are on screen.
# Every selector is a testID: the visible words are in two languages. Run on the iOS
# simulator and the Android emulator against `next dev` serving the demo database; never in
# CI. Nothing here writes to the server. Run it with `run.sh`.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/sign-in.yaml
- assertVisible:
    id: "job-list"
- assertVisible:
    id: "job-row-0"
- tapOn:
    id: "tab-me"
- assertVisible:
    id: "me-name"
# The address the office invited this person with: shown, and read-only.
- scrollUntilVisible:
    element:
      id: "me-sign-in-email"
    centerElement: true
# Me: the person's own contact phone, saved through the server (suite.sh reads it back).
- tapOn:
    id: "me-phone"
- inputText: "4015550177"
# Under a tall keyboard Save is below the fold: scrolled to, as a person would.
- scrollUntilVisible:
    element:
      id: "me-save"
    centerElement: true
- tapOn:
    id: "me-save"
- extendedWaitUntil:
    visible:
      id: "me-saved"
    timeout: 15000
- takeScreenshot: me
# Back up to the language, above where Save was scrolled to.
- scrollUntilVisible:
    element:
      id: "language-es"
    direction: UP
    centerElement: true
- tapOn:
    id: "language-es"
- tapOn:
    id: "tab-today"
- assertVisible:
    id: "job-list"
# In Spanish: the long label takes a second line, and is not cut.
- tapOn:
    id: "job-row-0"
- assertVisible:
    id: "job-card"
- takeScreenshot: today-off-es
- tapOn:
    id: "sync-synced|sync-pending|sync-attention"
- assertVisible:
    id: "sync-now"
- takeScreenshot: today-chip-sheet-es
- tapOn:
    id: "sync-close"
