# The office removed the shift a moment ago and this phone, connected, has not pulled since:
# it still offers the shift. The start is sent at once, the server refuses it, and the
# chip says the entry needs attention, with the reason behind it; the phone is off the
# clock.
appId: app.jpteq.trader
---
- assertVisible:
    id: "offer-eligible"
- tapOn:
    id: "clock-in"
- extendedWaitUntil:
    visible:
      id: "sync-attention"
    timeout: 60000
- takeScreenshot: today-needs-attention
- tapOn:
    id: "sync-attention"
- assertVisible:
    id: "entry-refused-0"
- takeScreenshot: today-refused-entry
- tapOn:
    id: "sync-close"
- assertVisible:
    id: "clock-off"
