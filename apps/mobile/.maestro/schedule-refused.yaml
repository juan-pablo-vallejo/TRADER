# The office removed the shift before this phone heard of it, and the phone started it
# (schedule-stale-capture, with the API down). The start is sent once the API is back, the
# server refuses it, and the chip says the entry needs attention, with the reason behind
# it; the phone is off the clock.
appId: app.jpteq.trader
---
- extendedWaitUntil:
    visible:
      id: "sync-attention"
    timeout: 60000
- takeScreenshot: today-needs-attention
- tapOn:
    id: "sync-attention"
- assertVisible:
    id: "entry-refused-0"
- takeScreenshot: today-refused-entry
- tapOn:
    id: "sync-close"
- assertVisible:
    id: "clock-off"
