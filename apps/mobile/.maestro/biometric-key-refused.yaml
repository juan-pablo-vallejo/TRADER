# The office deactivated the person whose key this phone holds: a sign-in by it is refused
# by the server, said as an address no company has added, and the key goes.
appId: app.jpteq.trader
---
- tapOn:
    id: "sign-in-key"
- extendedWaitUntil:
    visible: "No company has added this sign-in. Ask the office."
    timeout: 30000
- assertNotVisible:
    id: "sign-in-key"
- takeScreenshot: biometric-key-refused
