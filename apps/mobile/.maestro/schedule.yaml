# Under the weekly schedule, a person with a shift now: the card is that shift's jobsite
# with its hours, there is nothing to pick, one tap starts, and the shift is on their
# schedule tab.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/sign-in.yaml
- assertVisible:
    id: "offer-eligible"
- assertNotVisible:
    id: "job-list"
- takeScreenshot: today-shift
- tapOn:
    id: "clock-in"
- assertVisible:
    id: "clock-working"
- extendedWaitUntil:
    visible:
      id: "sync-synced"
    timeout: 30000
- tapOn:
    id: "tab-week"
- assertVisible:
    id: "week-shift-0-0"
- takeScreenshot: week
# A shift opens the same job sheet as Today.
- tapOn:
    id: "week-shift-0-0"
- assertVisible:
    id: "job-notes"
- takeScreenshot: week-job-sheet
- tapOn:
    id: "job-close"
- assertVisible:
    id: "week-age"
- tapOn:
    id: "tab-today"
- tapOn:
    id: "clock-out"
- tapOn:
    id: "clock-out-confirm"
- assertVisible:
    id: "clock-off"
- extendedWaitUntil:
    visible:
      id: "sync-synced"
    timeout: 30000
