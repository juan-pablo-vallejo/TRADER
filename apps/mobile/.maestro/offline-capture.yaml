# With the API unreachable (suite.sh has stopped it): the app is already signed in from the
# flow before. A clock-in and a clock-out are captured, the clock follows them, and the
# chip says they are saved on the phone and opens on each of them. Nothing is lost by
# closing the app in between.
appId: app.jpteq.trader
---
- tapOn:
    id: "job-row-0"
- tapOn:
    id: "clock-in"
- runFlow:
    file: parts/reminders.yaml
- assertVisible:
    id: "clock-working"
- takeScreenshot: today-saved-on-phone
- tapOn:
    id: "sync-pending"
- assertVisible:
    id: "entry-unsent-0"
- tapOn:
    id: "sync-close"
- stopApp
- launchApp:
    stopApp: false
- runFlow:
    when:
      true: ${LAUNCH == "maestro"}
    commands:
      - openLink: "exp+trader://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
# On Android only the link's first part survives Maestro's openLink, which is enough for a
# build that has been opened once already.
- runFlow:
    when:
      true: ${LAUNCH == "adb"}
    commands:
      - openLink: "exp+trader://?__expo_url=http%3A%2F%2Flocalhost%3A8081"
      # Without the link's other parts a freshly installed development build opens its own
      # menu over the app: put it away. It is the tool's, and has no test id of ours.
      # It comes up once the bundle has loaded, so it is waited for; it may never come.
      - extendedWaitUntil:
          visible: "Toggle performance monitor"
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible: "Toggle performance monitor"
          commands:
            - back
- extendedWaitUntil:
    visible:
      id: "clock-working"
    timeout: 120000
- tapOn:
    id: "clock-out"
- tapOn:
    id: "clock-out-confirm"
- assertVisible:
    id: "clock-off"
- tapOn:
    id: "sync-pending"
- assertVisible:
    id: "entry-unsent-1"
- takeScreenshot: today-waiting-sheet
- tapOn:
    id: "sync-close"
