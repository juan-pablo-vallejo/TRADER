# The sign-in screen in Spanish: chosen in Me, it is kept on the phone through a sign-out,
# so the screen after it is in Spanish, with its trouble lines, a refused code's sentence
# and a sign-in, then the key's offer. ${EMAIL} signs in first, Ana Ruiz second.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/sign-in.yaml
- tapOn:
    id: "tab-me"
- tapOn:
    id: "language-es"
- scrollUntilVisible:
    element:
      id: "sign-out"
    centerElement: true
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "sign-in-address"
    timeout: 30000
- assertVisible: "Acceso del equipo"
- assertVisible: "Envíame un código"
- scrollUntilVisible:
    element:
      id: "sign-in-trouble"
- tapOn:
    id: "sign-in-trouble"
- scrollUntilVisible:
    element:
      id: "sign-in-trouble-help"
- takeScreenshot: sign-in-es
# Signed in again by someone with no answer to the key's offer kept on this phone: the
# offer, in Spanish, comes after their code.
- runFlow:
    file: parts/code.yaml
    env:
      ADDRESS: "ana.ruiz@demo.invalid"
      CODE: "111111"
- extendedWaitUntil:
    visible: "Ese código no funcionó. Revísalo o pide uno nuevo."
    timeout: 15000
- takeScreenshot: sign-in-code-es
- tapOn:
    id: "sign-in-code"
- inputText: "123456"
# The offer after a code, in Spanish.
- extendedWaitUntil:
    visible:
      id: "biometric-offer"
    timeout: 30000
- assertVisible: "Entra más rápido"
- takeScreenshot: biometric-offer-es
- runFlow:
    file: parts/landed.yaml
