# Under the weekly schedule, a second person with no shift: the clock says to ask the
# office and offers no start, and their schedule shows nothing of anybody else's.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/sign-in.yaml
- assertVisible:
    id: "offer-none"
- assertVisible:
    id: "clock-in"
    enabled: false
- tapOn:
    id: "tab-week"
- assertVisible:
    id: "week-empty"
- assertVisible:
    id: "hours-empty"
