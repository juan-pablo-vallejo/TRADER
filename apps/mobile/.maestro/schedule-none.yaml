# Under the weekly schedule, a second person with no shift: no button to clock in, the
# reason, and Call the office; and their schedule shows nothing of anybody else's.
appId: app.jpteq.trader
---
- runFlow:
    file: parts/sign-in.yaml
- assertVisible:
    id: "offer-none"
- assertNotVisible:
    id: "clock-in"
- assertVisible:
    id: "call-office"
- takeScreenshot: today-no-shift
- tapOn:
    id: "tab-week"
- assertVisible:
    id: "week-empty"
- assertVisible:
    id: "hours-empty"
