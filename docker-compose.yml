# Local Postgres for development. The Neon serverless driver cannot talk to this —
# it speaks HTTP/WebSocket to Neon's proxy — so packages/db switches to the
# node-postgres driver when USE_LOCAL_POSTGRES=true. See packages/db/src/client.ts.
services:
  postgres:
    image: postgres:18-alpine
    container_name: trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql, with the data
      # in a major-version subdirectory, so `pg_upgrade --link` can work without
      # crossing a mount boundary. Mounting /var/lib/postgresql/data directly (the
      # pre-18 convention) makes the image refuse to start.
      - trader-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trader-pgdata:
