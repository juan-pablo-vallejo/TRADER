packages:
  - "apps/*"
  - "packages/*"
# esbuild ships a platform-specific native binary and needs its postinstall to run.
# vitest depends on it. Denying this breaks the test runner.
allowBuilds:
  esbuild: true
# RULES:68; explicit, so the quarantine is strict (pnpm.io/settings).
minimumReleaseAge: 1440
