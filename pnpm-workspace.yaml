packages:
  - "apps/*"
  - "packages/*"
# esbuild ships a platform-specific native binary and needs its postinstall to run.
# vitest depends on it. Denying this breaks the test runner.
# browser-tabs-lock and core-js arrive with @clerk/expo; their postinstall scripts only print
# a message (read 2026-11-15), so they are denied by name and build nothing.
allowBuilds:
  browser-tabs-lock: false
  core-js: false
  esbuild: true
# RULES:68; explicit, so the quarantine is strict (pnpm.io/settings).
minimumReleaseAge: 1440

# Transitive packages held at their patched releases until their parents ask for them
# (the Audit workflow's advisories): remove a line when `pnpm why` shows the parent's own
# range has moved past it.
overrides:
  "source-map-js@<1.2.2": ^1.2.2
  "vite@>=7.0.0 <7.3.7": ^7.3.7
