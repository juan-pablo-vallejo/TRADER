version: 2

# A solo-maintained payroll application should not learn about a compromised
# dependency from the news. Weekly is frequent enough to stay current without
# generating more pull requests than one person can review.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript is pinned to 5.9.x by a recorded decision: typescript-eslint
      # does not support TS 7 and has deferred it pending the new compiler API.
      # CI proved this the day it was set up — the TS 7.0.2 bump failed with
      # "typescript-eslint does not support TS 7.0". Without this rule Dependabot
      # re-proposes the same failing upgrade every week. Remove it when
      # typescript-eslint ships TS 7 support; see docs/DECISIONS.md.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # @types/node must track the Node runtime, not the newest release. We run
      # Node 24 locally and in CI; types from a later major describe APIs the
      # runtime does not have, so code type-checks and then fails when it runs.
      # Dependabot cannot know which Node we use, so it offered 26. Lift this
      # when the runtime itself moves — CI's node-version and the engines field
      # are the things to change first.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

    groups:
      # One PR per ecosystem-ish cluster rather than per package, so a quiet week
      # produces a handful of reviews instead of thirty.
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier*"
          - "vitest"
      drizzle:
        patterns:
          - "drizzle-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
