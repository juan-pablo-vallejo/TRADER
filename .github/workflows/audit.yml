name: Audit

# Beside CI and never part of it (RULES, Git and CI): the required check stays `check`.
# Two readings of the tree with no secret and no write: known advisories against the
# lockfile, and credentials committed by mistake. The release gate reads this run
# (ARCHITECTURE, 2026-11-16, production and the release gate).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories are published against code that has not changed: weekly, Monday 09:00 UTC.
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Reads the lockfile; installs nothing. What ships: red on high or critical.
      - name: Advisories against what is deployed
        run: pnpm audit --prod --audit-level high

      # Build and test tooling: listed in full, red only on critical.
      - name: Advisories against the toolchain
        run: pnpm audit --audit-level critical

  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: a secret removed in a later commit is still published.
          fetch-depth: 0

      - name: Fetch gitleaks, verified
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      # --redact: a finding is reported by file, line and rule, never by its value.
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .'
