name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check on main. Renaming it disarms branch protection.
  check:
    # The image is a version, pinned like node-version. `ubuntu-latest` is 24.04 today and
    # moves on GitHub's schedule (26.04 is already listed), which would change the toolchain
    # under the job without a commit.
    runs-on: ubuntu-24.04

    # The three compose variables, named as in .env.example. The service below, the migrate
    # step and the client test all read these, so the credentials exist once. No .env in CI.
    env:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader

    # `pnpm db:migrate` and the client test need a real Postgres, the same major as compose.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # The `services` block itself has no `env` context, but the health command runs inside
        # the container under its own environment, where the same variables are set.
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Before the tests: the client test and, from Stage 2 line 8, the invariant tests run
      # against the migrated schema.
      - run: pnpm db:migrate
      - run: pnpm test

      # Document caps from docs/RULES.md, enforced here so an overrun is a red X, not a memory.
      - run: |
          cap() { test "$(wc -l < "$1")" -le "$2" || { echo "$1 exceeds $2 lines"; exit 1; }; }
          cap README.md 30
          cap CLAUDE.md 40
          cap docs/ARCHITECTURE.md 200
          cap docs/MEMORY.md 200
          for f in docs/PRD.md docs/RULES.md docs/DESIGN.md docs/TASKS.md; do
            cap "$f" 150
          done
