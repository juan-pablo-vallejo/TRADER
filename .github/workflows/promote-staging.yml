name: Promote staging

# Staging's promotion (ARCHITECTURE, 2026-11-16, staging promotion and migration gate;
# RULES, Git and CI). After a merge into `main` whose `check` passed, this carries that
# commit to staging (ARCHITECTURE, 2026-11-17, staging from `main`): migrations rehearsed
# on the kept Neon branch, staging migrated, `main` deployed to the staging project by its
# deploy hook, the host held to this commit, the browser suite run, the outcome reported
# as a commit status. It moves no branch and holds no credential of Vercel's account.
# It holds staging's secrets, so it runs only code already on `main`: it is started by CI's
# completion on `main` or by a dispatch on `main`, never by a pull request's event, and
# GitHub reads this file from the default branch for both.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearse-only never migrates staging; promote does, when the plan allows it"
        type: choice
        options: [rehearse-only, promote]
        default: rehearse-only
      authorize_through:
        description: "Owner only, with promote: the approval code an earlier run's report printed for this commit and its pending migrations"
        type: string
        default: ""

# Nothing by default; each job states what its token may do.
permissions: {}

# One promotion at a time, never cancelled part-way. GitHub keeps only the newest waiting
# run of a group, so a commit overtaken while it waits is skipped in favour of its successor.
concurrency:
  group: staging-promotion
  cancel-in-progress: false

env:
  # The commit CI passed, or `main`'s head for a dispatch.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  database:
    # CI's push run on `main` in this repository, passed; or a dispatch on `main`.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      checks: read
    outputs:
      proceed: ${{ steps.done.outputs.proceed }}
      withheld: ${{ steps.plan.outputs.withheld }}

    # The replay: the same journal on an empty database of the same major, which the
    # rehearsal branch and staging are then compared with.
    env:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: trader
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight — the commit is on main
        run: |
          set -euo pipefail
          echo "STAGE=before-staging-change" >> "$GITHUB_ENV"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not a commit of main"; exit 1
          fi
          echo "### Promotion of \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight — a dispatched commit passed check
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=check" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::check has not passed on $SHA"; exit 1
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Plan — what is pending, what to rehearse, whether staging may be migrated
        id: plan
        env:
          STAGING_MIGRATOR_URL: ${{ secrets.STAGING_MIGRATOR_URL }}
          REHEARSAL_MIGRATOR_URL: ${{ secrets.REHEARSAL_MIGRATOR_URL }}
          # C2's pins: the endpoint id each string must be on, direct. A variable or a
          # secret of the environment, whichever the owner made.
          STAGING_ENDPOINT_ID: ${{ secrets.STAGING_ENDPOINT_ID || vars.STAGING_ENDPOINT_ID }}
          REHEARSAL_ENDPOINT_ID: ${{ secrets.REHEARSAL_ENDPOINT_ID || vars.REHEARSAL_ENDPOINT_ID }}
          PROMOTION_COMMIT: ${{ env.SHA }}
          PROMOTION_EVENT: ${{ github.event_name }}
          PROMOTION_MODE: ${{ inputs.mode }}
          PROMOTION_AUTHORIZE_THROUGH: ${{ inputs.authorize_through }}
          PROMOTION_BY_OWNER: ${{ github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
        run: pnpm --filter @trader/db exec tsx src/run-promotion.ts state

      - name: Replay the journal on an empty database
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm --filter @trader/db exec tsx src/run-promotion.ts fingerprint > "$RUNNER_TEMP/replay.txt"
          test -s "$RUNNER_TEMP/replay.txt"

      - name: Rehearse the pending migrations on the rehearsal branch
        if: steps.plan.outputs.rehearse == 'true'
        env:
          DATABASE_URL: ${{ secrets.REHEARSAL_MIGRATOR_URL }}
          TRADER_MIGRATE_PURPOSE: promotion
        run: pnpm db:migrate

      - name: Verify the rehearsal — the journal exactly, and the replay's schema
        if: steps.plan.outputs.pending != '0'
        env:
          REHEARSAL_MIGRATOR_URL: ${{ secrets.REHEARSAL_MIGRATOR_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @trader/db exec tsx src/run-promotion.ts expect-current REHEARSAL_MIGRATOR_URL
          pnpm --filter @trader/db exec tsx src/run-promotion.ts fingerprint REHEARSAL_MIGRATOR_URL > "$RUNNER_TEMP/rehearsal.txt"
          diff "$RUNNER_TEMP/replay.txt" "$RUNNER_TEMP/rehearsal.txt"
          echo "- rehearsal: the journal applied, schema equal to a fresh replay ($(wc -l < "$RUNNER_TEMP/replay.txt") lines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop — staging's migration is withheld
        if: steps.plan.outputs.migrate == 'withheld'
        env:
          WITHHELD: ${{ steps.plan.outputs.withheld }}
          CODE: ${{ steps.plan.outputs.approval_code }}
        run: |
          set -euo pipefail
          {
            echo "- **stopped before staging changed** ($WITHHELD)"
            echo "- staging is migrated only by the owner's dispatch of this workflow while \`main\` is still at \`$SHA\`: mode \`promote\`, authorize_through \`$CODE\`"
            echo "- the code holds for this commit and the migrations listed above, content included; a later commit needs its own report"
          } >> "$GITHUB_STEP_SUMMARY"
          # A rehearsal that was asked for and passed is a green run; a promotion that
          # could not finish is not.
          [ "$WITHHELD" = "rehearse_only" ]

      - name: Migrate staging
        if: steps.plan.outputs.migrate == 'automatic' || steps.plan.outputs.migrate == 'authorized'
        env:
          DATABASE_URL: ${{ secrets.STAGING_MIGRATOR_URL }}
          TRADER_MIGRATE_PURPOSE: promotion
        run: |
          set -euo pipefail
          # One transaction: a failure here leaves staging as it was.
          pnpm db:migrate
          echo "STAGE=migrated-not-deployed" >> "$GITHUB_ENV"

      - name: Verify staging — the journal exactly, and the replay's schema
        if: steps.plan.outputs.migrate != 'withheld'
        env:
          STAGING_MIGRATOR_URL: ${{ secrets.STAGING_MIGRATOR_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @trader/db exec tsx src/run-promotion.ts expect-current STAGING_MIGRATOR_URL
          pnpm --filter @trader/db exec tsx src/run-promotion.ts fingerprint STAGING_MIGRATOR_URL > "$RUNNER_TEMP/staging.txt"
          diff "$RUNNER_TEMP/replay.txt" "$RUNNER_TEMP/staging.txt"
          echo "- staging: the journal applied, schema equal to a fresh replay" >> "$GITHUB_STEP_SUMMARY"

      - name: Done
        id: done
        if: steps.plan.outputs.migrate != 'withheld'
        run: echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Report a failure by where it happened
        if: failure()
        run: |
          echo "- **failed: ${STAGE:-before-staging-change}**" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: database
    if: needs.database.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    # No checkout and no token: this job reads two public answers and calls one address.
    permissions: {}
    outputs:
      result: ${{ steps.hook.outputs.result }}
    steps:
      # The hook belongs to the staging project and to `main`, and builds that branch's
      # head, whatever it is by then: it takes no commit. So it is called only while the
      # head is this run's commit, and the verify job then holds the host to that commit.
      # A merge landing between the two lines below is the one window left: the hook
      # would build the newer commit, verify would stay red here, and that commit's own
      # run, next in the queue, migrates and verifies it.
      - name: Deploy main to the staging project by its deploy hook
        id: hook
        env:
          STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail
          # Anyone holding the hook's address can deploy with it, so it is sent to
          # Vercel's own host and nowhere else, and never printed.
          case "$STAGING_DEPLOY_HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            *) echo "::error::the STAGING_DEPLOY_HOOK secret is not set, or is not a Vercel deploy hook"; exit 1 ;;
          esac
          case "$STAGING_URL" in https://*) ;; *) echo "::error::the STAGING_URL secret is not set"; exit 1 ;; esac

          serving=$(curl -sS --max-time 10 "$STAGING_URL/api/ready" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ "$serving" = "$SHA" ]; then
            echo "- staging's host already serves \`$SHA\`: nothing deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "result=already" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          case "$head" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "::error::main's head could not be read"; exit 1 ;;
          esac
          if [ "$head" != "$SHA" ]; then
            echo "- **not deployed**: \`main\` has moved on to \`$head\`, and the hook would build that commit, not this one. Its own run follows and deploys it" >> "$GITHUB_STEP_SUMMARY"
            echo "result=superseded" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          answer=$(curl -sS --proto '=https' --max-time 30 -X POST "$STAGING_DEPLOY_HOOK" || true)
          state=$(printf '%s' "$answer" | jq -r '.job.state // empty' 2>/dev/null || true)
          if [ -z "$state" ]; then
            echo "::error::the deploy hook did not answer with a job"; exit 1
          fi
          echo "- deploy hook called for \`main\` at \`$SHA\` (job $state)" >> "$GITHUB_STEP_SUMMARY"
          echo "result=called" >> "$GITHUB_OUTPUT"

      - name: Report a failure by where it happened
        if: failure()
        run: |
          echo "- **failed: migrated-not-deployed** (staging's database is at this commit's journal; nothing was deployed)" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: [database, deploy]
    if: needs.deploy.outputs.result == 'called' || needs.deploy.outputs.result == 'already'
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # Fails closed: the suite never runs on a host that has not named this commit.
      - name: Wait until staging's host serves this commit and is ready
        env:
          # A secret of the environment, so the host is masked in this public log.
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail
          echo "STAGE=migrated-not-deployed" >> "$GITHUB_ENV"
          case "$STAGING_URL" in https://*) ;; *) echo "::error::the STAGING_URL secret is not set"; exit 1 ;; esac
          for attempt in $(seq 1 90); do
            body=$(curl -sS --max-time 10 "$STAGING_URL/api/ready" || true)
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            ready=$(printf '%s' "$body" | jq -r '.ready // empty' 2>/dev/null || true)
            if [ "$commit" = "$SHA" ] && [ "$ready" = "true" ]; then
              echo "- deployed revision: \`$commit\`, ready" >> "$GITHUB_STEP_SUMMARY"
              echo "STAGE=deployed-failing" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "::error::staging's host did not serve $SHA within 15 minutes (last answered: commit '${commit:-none}', ready '${ready:-none}')"
          exit 1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trader/web exec playwright install --with-deps chromium

      # Clerk's fixed test code is public, so the suite signs in with single-use tickets
      # (apps/web/e2e/tickets.ts). The development instance's key reaches this one step,
      # which runs that one file with `node` and nothing a package installed; the tickets
      # are masked and live ten minutes.
      - name: Sign-in tickets for the suite's two people
        env:
          CLERK_STAGING_SECRET_KEY: ${{ secrets.CLERK_STAGING_SECRET_KEY }}
          E2E_ADMIN_PHONE: ${{ vars.E2E_ADMIN_PHONE }}
          E2E_WORKER_PHONE: ${{ vars.E2E_WORKER_PHONE }}
        run: node apps/web/e2e/tickets.ts

      # No trace, no video and no uploaded artifact: this log and its artifacts are public,
      # and any of them could hold a signed-in session.
      - name: Browser suite on staging's host
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          E2E_ADMIN_PHONE: ${{ vars.E2E_ADMIN_PHONE }}
          E2E_WORKER_PHONE: ${{ vars.E2E_WORKER_PHONE }}
          # The browser suite's own tenant on the shared database: an id, not a secret.
          E2E_COMPANY_ID: ${{ vars.E2E_COMPANY_ID }}
          E2E_EXPECT_COMMIT: ${{ env.SHA }}
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e
        run: |
          set -euo pipefail
          pnpm e2e:staging
          echo "- browser suite: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failure by where it happened
        if: failure()
        run: |
          echo "- **failed: ${STAGE:-migrated-not-deployed}**" >> "$GITHUB_STEP_SUMMARY"

  # Every run's outcome, on the commit itself: `gh api repos/<repo>/commits/<sha>/status`,
  # or the mark beside the commit on GitHub. It holds no secret and reads no environment.
  report:
    needs: [database, deploy, verify]
    if: always() && needs.database.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Staging readiness, as a status of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE: ${{ needs.database.result }}
          PROCEED: ${{ needs.database.outputs.proceed }}
          WITHHELD: ${{ needs.database.outputs.withheld }}
          DEPLOY: ${{ needs.deploy.result }}
          HOOK: ${{ needs.deploy.outputs.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          if [ "$VERIFY" = "success" ]; then
            state=success; say="migrated, deployed from main and verified by the browser suite"
          elif [ "$DATABASE" = "success" ] && [ "$PROCEED" != "true" ]; then
            echo "- rehearsal only: no status written" >> "$GITHUB_STEP_SUMMARY"; exit 0
          elif [ "$DATABASE" != "success" ] && [ -n "$WITHHELD" ]; then
            state=failure; say="not migrated: withheld ($WITHHELD); the owner's dispatch applies it, see the run"
          elif [ "$DATABASE" != "success" ]; then
            state=failure; say="the database job failed; the run's summary names the stage"
          elif [ "$HOOK" = "superseded" ]; then
            state=pending; say="migrated, not deployed: main moved on, and the newer commit's run deploys it"
          elif [ "$DEPLOY" != "success" ]; then
            state=failure; say="migrated, not deployed: the deploy hook failed"
          else
            state=failure; say="the host did not serve this commit, or the browser suite failed; see the run"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=staging -f description="${say:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "### Staging readiness: $state" >> "$GITHUB_STEP_SUMMARY"
          echo "- $say" >> "$GITHUB_STEP_SUMMARY"
